services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-false}
    container_name: nfse-api-sqlite
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_CLIENT=sqlite
      - DB_PATH=/app/data/nfse.db
      - API_TOKEN=${API_TOKEN:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - APP_ORIGIN=${APP_ORIGIN:-}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - ADN_REQUEST_DELAY_MS=${ADN_REQUEST_DELAY_MS:-500}
      - ADN_MAX_RETRIES=${ADN_MAX_RETRIES:-3}
      - ADN_ENV=${ADN_ENV:-homologacao}
      - ADN_BASE_URL_HOMOLOGACAO=${ADN_BASE_URL_HOMOLOGACAO:-https://adn.producaorestrita.nfse.gov.br}
      - ADN_BASE_URL_PRODUCAO=${ADN_BASE_URL_PRODUCAO:-https://adn.nfse.gov.br}
      - CERT_PASSWORD=${CERT_PASSWORD:-}
      - CERT_PATH=${CERT_PATH:-}
      - CERT_BASE64=${CERT_BASE64:-}
      - ENABLE_MOCK=${ENABLE_MOCK:-true}
      - ENABLE_UI=${ENABLE_UI:-true}
      - CERTIFICATES_DIR=/app/certs
      - CERT_ENCRYPTION_KEY=${CERT_ENCRYPTION_KEY:-}
      - PDF_RENDERER=${PDF_RENDERER:-gotenberg}
      - GOTENBERG_URL=${GOTENBERG_URL:-}
      - GOTENBERG_USERNAME=${GOTENBERG_USERNAME:-}
      - GOTENBERG_PASSWORD=${GOTENBERG_PASSWORD:-}
      - CHROMIUM_EXECUTABLE_PATH=${CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
      - PDF_TIMEOUT_MS=${PDF_TIMEOUT_MS:-60000}
      - PDF_EXPORT_TTL_MS=${PDF_EXPORT_TTL_MS:-3600000}
    volumes:
      - sqlite_data:/app/data
      - ${CERTIFICATES_HOST_DIR:-./certs}:/app/certs:rw
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${API_MEMORY_LIMIT:-512M}
        reservations:
          memory: 64M

volumes:
  sqlite_data:
    name: nfse_sqlite_data
